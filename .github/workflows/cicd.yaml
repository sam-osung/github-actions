name: Deploy to ec2

on:
  push:
    branches:
        - main



jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: login to ec2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "ssh login successful"
        



